name: Local fixture validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_fuzz:
        description: Run the extended 30-second-per-target fuzz campaign
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.check }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, static, unit, contract, fuzz-smoke, browser]
    env:
      OPENAI_API_KEY: ''
      TURSO_AUTH_TOKEN: ''
      TURSO_DATABASE_URL: ''
      GOTOOLCHAIN: local
    steps:
      - name: Initialize evidence (including setup failures)
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/validation-evidence"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE" /tmp/opencode
          printf 'event=%s\nrequested_sha=%s\njob=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_SHA" '${{ matrix.check }}' > "$EVIDENCE/revision.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record tested tree
        run: git rev-parse HEAD >> "$EVIDENCE/revision.txt"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.1.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.3'
      - name: Install validation dependencies and record tools
        shell: bash
        run: |
          set -o pipefail
          { python3 -m pip install -r scripts/requirements-checks.txt;
            go mod download;
            go version; node --version; python3 --version; python3 -m pip freeze;
          } 2>&1 | tee "$EVIDENCE/dependencies.log"
      - name: Install pinned browser (browser job only)
        if: matrix.check == 'browser'
        shell: bash
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP/browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.58.2 2>&1 | tee "$EVIDENCE/browser-install.log"
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install chromium 2>&1 | tee -a "$EVIDENCE/browser-install.log"
          CHROMIUM=$(node -e "console.log(require(process.env.RUNNER_TEMP + '/browser-tools/node_modules/playwright').chromium.executablePath())")
          test -x "$CHROMIUM"
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          "$CHROMIUM" --version | tee -a "$EVIDENCE/browser-install.log"
      - name: Required check
        shell: bash
        run: |
          set -o pipefail
          if [ '${{ matrix.check }}' = browser ]; then
            python3 scripts/browser_check.py "$EVIDENCE/browser" 2>&1 | tee "$EVIDENCE/check.log"
          else
            make '${{ matrix.check }}' 2>&1 | tee "$EVIDENCE/check.log"
          fi
      - name: Explicit manual full fuzz
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.full_fuzz && matrix.check == 'fuzz-smoke' }}
        shell: bash
        run: |
          set -o pipefail
          make fuzz-full 2>&1 | tee "$EVIDENCE/fuzz-full.log"
      - name: Record final job status
        if: always()
        run: printf 'status=%s\n' '${{ job.status }}' | tee "$EVIDENCE/status.log"
      - name: Preserve logs and tested SHA even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ matrix.check }}-${{ github.sha }}
          path: |
            ${{ env.EVIDENCE }}/*.txt
            ${{ env.EVIDENCE }}/*.log
            ${{ env.EVIDENCE }}/browser/*.log
            ${{ env.EVIDENCE }}/browser/*.json
            ${{ env.EVIDENCE }}/browser/*.png
          if-no-files-found: error
          retention-days: 14
